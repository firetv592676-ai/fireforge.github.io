<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireForge Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">F</span><span>FireForge</span></a><a class="github" href="/">Back to site</a></header>
<main><section class="hero" style="padding-top:70px"><div class="eyebrow">ADMIN</div><h1>Upload an <span>APK.</span></h1><p>The server extracts the package metadata and launcher icon automatically, then stores the APK and icon in Backblaze B2 when configured.</p><div class="feature-grid" style="padding-left:0;padding-right:0;grid-template-columns:1fr;max-width:720px"><form id="uploadForm" class="feature"><label>Admin token<br><input required name="token" type="password" placeholder="x-admin-token"></label><br><label>APK file<br><input required name="apk" type="file" accept=".apk,application/vnd.android.package-archive"></label><br><button class="primary" type="submit">Process & upload APK</button><pre id="status" style="margin-top:20px;display:none"></pre></form></div></section></main>
<script>
const f=document.getElementById('uploadForm'), s=document.getElementById('status');
f.addEventListener('submit', async e=>{
  e.preventDefault();
  const file=f.apk.files[0];
  const token=f.token.value;
  s.style.display='block';
  try {
    s.textContent='Creating secure upload URL…';
    let r=await fetch('/api/upload-url',{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify({filename:file.name,size:file.size})});
    let d=await r.json();
    if(!r.ok) throw new Error(d.error||'Unable to create upload URL');
    s.textContent='Uploading APK directly to Backblaze B2…';
    r=await fetch(d.url,{method:'PUT',headers:{'content-type':'application/vnd.android.package-archive'},body:file});
    if(!r.ok) throw new Error('Backblaze upload failed');
    s.textContent='Extracting metadata and launcher icon…';
    r=await fetch('/api/finalize-apk',{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify({id:d.id,key:d.key,filename:file.name,size:file.size})});
    d=await r.json();
    if(!r.ok) throw new Error(d.error||'Finalization failed');
    s.textContent=`Uploaded ${d.entry.name} (${d.entry.packageName||'package unknown'})\nIcon: ${d.entry.iconUrl?'extracted':'not found'}\nBackblaze B2: enabled`;
    f.reset();
  } catch(err) { s.textContent=err.message; }
});
</script></body></html>
