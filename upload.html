
<!doctype html>
<html lang="en">

<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>FireForge Upload Center</title>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        sans-serif;

      color: #e9edf4;
      background: #0b0e13;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          180deg,
          #101722,
          #0b0e13
        );

      min-height: 100vh;
    }

    .wrap {
      width: min(720px, 92vw);
      margin: 40px auto;
    }

    .card {
      background: #111821;
      border: 1px solid #26303c;
      border-radius: 20px;
      padding: 28px;
      box-shadow:
        0 20px 60px #0005;
    }

    h1 {
      margin: 0 0 8px;
    }

    .muted {
      color: #98a4b3;
    }

    .row {
      display: grid;
      gap: 7px;
      margin: 18px 0;
    }

    label {
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;

      background: #0b1016;
      border: 1px solid #2a3543;

      color: #fff;

      border-radius: 11px;
      padding: 12px;

      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 11px;

      padding: 12px 16px;

      font: inherit;
      font-weight: 800;

      cursor: pointer;

      background: #edf2f7;
      color: #0b0e13;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 12px;

      border-radius: 11px;
      background: #0b1016;

      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    .filebox {
      padding: 14px;

      border: 1px dashed #334154;
      border-radius: 12px;
    }

    .hint {
      font-size: .8rem;
      color: #7f8b9b;
      margin-top: 8px;
    }
  </style>

</head>

<body>

  <main class="wrap">

    <section class="card">

      <h1>FireForge Upload Center</h1>

      <p class="muted">
        Upload an app or security-research file
        to its Google Drive folder.
      </p>

      <form
        id="uploadForm"
        onsubmit="submitForm(this); return false;"
      >

        <div class="row">

          <label for="type">
            Type
          </label>

          <select
            name="type"
            id="type"
            required
          >

            <option value="apps">
              App / APK
            </option>

            <option value="exploits">
              Exploit / Security Research
            </option>

          </select>

        </div>


        <div class="row">

          <label for="displayName">
            Display name
          </label>

          <input
            name="displayName"
            id="displayName"
            placeholder="Name shown on FireForge"
            maxlength="100"
            required
          >

        </div>


        <div class="row">

          <label for="description">
            Description
          </label>

          <textarea
            name="description"
            id="description"
            placeholder="Describe the app or research item..."
            maxlength="1000"
            required
          ></textarea>

        </div>


        <div class="row">

          <label for="myFile">
            File
          </label>

          <div class="filebox">

            <input
              name="myFile"
              id="myFile"
              type="file"
              required
            >

            <div class="hint">
              Apps accepts APK files.
              Exploit entries may use ZIP, PDF,
              TXT, and other research files.
            </div>

          </div>

        </div>


        <div class="row">

          <label for="pin">
            Admin PIN
          </label>

          <input
            name="pin"
            id="pin"
            type="password"
            autocomplete="off"
            required
          >

        </div>


        <button
          id="submitBtn"
          type="submit"
        >
          Upload &amp; publish
        </button>

      </form>


      <div
        id="status"
        class="status hidden"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <script>

    function submitForm(form) {

      const btn =
        document.getElementById('submitBtn');

      const status =
        document.getElementById('status');

      btn.disabled = true;

      btn.textContent = 'Uploading...';

      status.classList.remove('hidden');

      status.textContent =
        'Uploading to Google Drive...';

      google.script.run

        .withSuccessHandler(function(result) {

          status.textContent =
            result.message ||
            'Uploaded successfully.';

          btn.disabled = false;

          btn.textContent =
            'Upload & publish';

          form.reset();

        })

        .withFailureHandler(function(error) {

          status.textContent =
            'Upload failed: ' +
            (
              error && error.message
                ? error.message
                : error
            );

          btn.disabled = false;

          btn.textContent =
            'Upload & publish';

        })

        .processUpload(form);

    }

  </script>

</body>

</html>
